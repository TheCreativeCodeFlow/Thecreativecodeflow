<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 90" width="100%" height="100%">
  <defs>
    <style>
      :root {
        --bg: #0b0b0c;
        --panel-bg: #121214;
        --border: #222225;
        --text-primary: #e4e4e7;
        --text-secondary: #71717a;
        --accent: #e2b13c;
        --accent-rgb: 226, 177, 60;
        --led-green: #30d158;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #ffffff;
          --panel-bg: #f5f5f7;
          --border: #e5e5ea;
          --text-primary: #1c1c1e;
          --text-secondary: #8e8e93;
          --accent: #c69c24;
          --accent-rgb: 198, 156, 36;
          --led-green: #34c759;
        }
      }
      .pipeline-bg {
        fill: var(--panel-bg);
        stroke: var(--border);
        stroke-width: 1;
      }
      .track-line {
        stroke: var(--border);
        stroke-width: 2;
        stroke-linecap: round;
      }
      .active-track {
        stroke: var(--accent);
        stroke-width: 2;
        stroke-linecap: round;
      }
      .node-circle {
        fill: var(--bg);
        stroke: var(--border);
        stroke-width: 2;
      }
      .node-completed {
        fill: var(--text-secondary);
        stroke: var(--border);
        stroke-width: 2;
      }
      .node-active {
        fill: var(--accent);
        stroke: var(--accent);
        stroke-width: 2;
      }
      .node-label {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 10px;
        font-weight: 600;
        fill: var(--text-secondary);
        text-anchor: middle;
      }
      .label-active {
        fill: var(--text-primary);
        font-weight: 700;
      }
      .pulse-glow {
        animation: glow 1.5s infinite ease-in-out;
      }
      @keyframes glow {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="5" y="5" width="790" height="80" rx="8" class="pipeline-bg" />

  <!-- Background Track -->
  <line x1="40" y1="35" x2="760" y2="35" class="track-line" />
  
  <!-- Active Track (up to Testing/Deployment) -->
  <line x1="40" y1="35" x2="520" y2="35" class="active-track" />

  <!-- Nodes -->
  <!-- 1. Idea -->
  <circle cx="40" cy="35" r="5" class="node-completed" />
  <text x="40" y="62" class="node-label">Idea</text>

  <!-- 2. Research -->
  <circle cx="160" cy="35" r="5" class="node-completed" />
  <text x="160" y="62" class="node-label">Research</text>

  <!-- 3. Architecture -->
  <circle cx="280" cy="35" r="5" class="node-completed" />
  <text x="280" y="62" class="node-label">Architecture</text>

  <!-- 4. Development -->
  <circle cx="400" cy="35" r="6" class="node-active" />
  <text x="400" y="62" class="node-label label-active">Development</text>

  <!-- 5. Testing -->
  <circle cx="520" cy="35" r="6" class="node-active" />
  <text x="520" y="62" class="node-label label-active">Testing</text>

  <!-- 6. Deployment -->
  <circle cx="640" cy="35" r="5" class="node-circle" />
  <text x="640" y="62" class="node-label">Deployment</text>

  <!-- 7. Iteration -->
  <circle cx="760" cy="35" r="5" class="node-circle" />
  <text x="760" y="62" class="node-label">Iteration</text>

  <!-- Animated Moving Progress Dot -->
  <circle cy="35" r="4.5" fill="var(--accent)" class="pulse-glow">
    <animate attributeName="cx" values="400;520;640;520;400" dur="5s" repeatCount="indefinite" />
  </circle>
</svg>
