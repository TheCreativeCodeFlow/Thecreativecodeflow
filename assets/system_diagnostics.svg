<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="diag-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061D30" />
      <stop offset="60%" stop-color="#042F40" />
      <stop offset="100%" stop-color="#061D30" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="diag-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064663" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#042F40" stop-opacity="0.75" />
    </linearGradient>

    <!-- Dot Grid -->
    <pattern id="diag-dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="0.75" fill="#064663" opacity="0.5" />
    </pattern>
  </defs>

  <style>
    .diag-head { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11px; font-weight: 700; fill: #00C9B7; letter-spacing: 2px; }
    .diag-sub { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; font-size: 8.5px; fill: #8FA7B5; letter-spacing: 1px; }
    .col-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; font-weight: 700; fill: #EAF2F5; letter-spacing: 0.2px; }
    .param-label { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 8.5px; fill: #8FA7B5; font-weight: 600; }
    .param-val { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 9px; fill: #00C9B7; font-weight: 700; }
    .param-val-alt { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 9px; fill: #EAF2F5; font-weight: 600; }
    .param-val-gold { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 9px; fill: #F0B45F; font-weight: 700; }
  </style>

  <!-- Base Canvas -->
  <rect width="900" height="180" rx="8" fill="url(#diag-bg)" stroke="#064663" stroke-width="1.5" />
  <rect width="900" height="180" rx="8" fill="url(#diag-dots)" />

  <!-- Top Title HUD -->
  <g transform="translate(28, 22)">
    <circle cx="5" cy="4" r="3.5" fill="#00C9B7">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="18" y="8" class="diag-head">WORKSPACE DIAGNOSTICS // ENGINEERING ENVIRONMENT SPECIFICATIONS</text>
    <text x="844" y="8" class="diag-sub" text-anchor="end">NODE SPECIFICATION: CONFIGURED</text>
    <line x1="0" y1="16" x2="844" y2="16" stroke="#064663" stroke-width="1" />
  </g>

  <!-- COLUMN 1: RUNTIME CONFIGURATION -->
  <g transform="translate(28, 48)">
    <rect width="268" height="114" rx="5" fill="url(#diag-card)" stroke="#064663" stroke-width="1" />
    <rect width="268" height="3" rx="1.5" fill="#00C9B7" />

    <text x="14" y="20" class="col-title">Primary Runtimes &amp; Shell</text>
    <line x1="14" y1="26" x2="254" y2="26" stroke="#064663" stroke-width="0.75" />

    <g transform="translate(14, 38)">
      <text x="0" y="8" class="param-label">PRIMARY RUNTIME</text>
      <text x="240" y="8" class="param-val" text-anchor="end">Node.js LTS / TS</text>

      <text x="0" y="26" class="param-label">SECONDARY RUNTIME</text>
      <text x="240" y="26" class="param-val-alt" text-anchor="end">Python 3 / Java</text>

      <text x="0" y="44" class="param-label">SHELL ENVIRONMENT</text>
      <text x="240" y="44" class="param-val-alt" text-anchor="end">Zsh / Bash / POSIX</text>

      <text x="0" y="62" class="param-label">PACKAGE MANAGER</text>
      <text x="240" y="62" class="param-val" text-anchor="end">pnpm workspaces</text>
    </g>
  </g>

  <!-- COLUMN 2: WORKSPACE & MONOREPO ARCHITECTURE -->
  <g transform="translate(316, 48)">
    <rect width="268" height="114" rx="5" fill="url(#diag-card)" stroke="#064663" stroke-width="1" />
    <rect width="268" height="3" rx="1.5" fill="#064663" />

    <text x="14" y="20" class="col-title">Workspace Orchestration</text>
    <line x1="14" y1="26" x2="254" y2="26" stroke="#064663" stroke-width="0.75" />

    <g transform="translate(14, 38)">
      <text x="0" y="8" class="param-label">BUILD ENGINE</text>
      <text x="240" y="8" class="param-val" text-anchor="end">Turborepo Pipeline</text>

      <text x="0" y="26" class="param-label">TYPE INTEGRITY</text>
      <text x="240" y="26" class="param-val" text-anchor="end">TypeScript Strict</text>

      <text x="0" y="44" class="param-label">LINTING ENGINE</text>
      <text x="240" y="44" class="param-val-alt" text-anchor="end">ESLint Flat Config</text>

      <text x="0" y="62" class="param-label">STYLE FORMATTING</text>
      <text x="240" y="62" class="param-val-alt" text-anchor="end">Prettier Configured</text>
    </g>
  </g>

  <!-- COLUMN 3: DEPLOYMENT & CONTAINER SPECIFICATION -->
  <g transform="translate(604, 48)">
    <rect width="268" height="114" rx="5" fill="url(#diag-card)" stroke="#064663" stroke-width="1" />
    <rect width="268" height="3" rx="1.5" fill="#F0B45F" />

    <text x="14" y="20" class="col-title">Automation &amp; Containers</text>
    <line x1="14" y1="26" x2="254" y2="26" stroke="#064663" stroke-width="0.75" />

    <g transform="translate(14, 38)">
      <text x="0" y="8" class="param-label">CONTAINER ENGINE</text>
      <text x="240" y="8" class="param-val-gold" text-anchor="end">Docker &amp; Compose</text>

      <text x="0" y="26" class="param-label">CI / CD AUTOMATION</text>
      <text x="240" y="26" class="param-val" text-anchor="end">GitHub Actions</text>

      <text x="0" y="44" class="param-label">VERSION CONTROL</text>
      <text x="240" y="44" class="param-val-alt" text-anchor="end">Git / Conventional Commits</text>

      <text x="0" y="62" class="param-label">TASK ISOLATION</text>
      <text x="240" y="62" class="param-val-gold" text-anchor="end">Worker Daemon Pools</text>
    </g>
  </g>
</svg>
