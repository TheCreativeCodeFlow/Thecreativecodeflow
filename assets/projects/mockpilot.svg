<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 140" width="100%" height="100%">
  <defs>
    <style>
      :root {
        --bg: #0b0b0c;
        --panel-bg: #121214;
        --border: #222225;
        --text-primary: #e4e4e7;
        --text-secondary: #71717a;
        --accent: #e2b13c;
        --led-green: #30d158;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #ffffff;
          --panel-bg: #f5f5f7;
          --border: #e5e5ea;
          --text-primary: #1c1c1e;
          --text-secondary: #8e8e93;
          --accent: #c69c24;
          --led-green: #34c759;
        }
      }
      .project-bg {
        fill: var(--panel-bg);
        stroke: var(--border);
        stroke-width: 1;
      }
      .title-text {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 15px;
        font-weight: 700;
        fill: var(--text-primary);
      }
      .stack-text {
        font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Monaco, Consolas, monospace;
        font-size: 10px;
        fill: var(--accent);
      }
      .desc-text {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 11px;
        line-height: 1.5;
        fill: var(--text-secondary);
      }
      .key-text {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 8px;
        font-weight: 700;
        letter-spacing: 1px;
        fill: var(--text-secondary);
      }
      .val-text {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 11px;
        font-weight: 600;
        fill: var(--text-primary);
      }
      .led-pulse {
        animation: pulse-glow 2s infinite ease-in-out;
      }
      @keyframes pulse-glow {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card Body -->
  <rect x="5" y="5" width="790" height="130" rx="8" class="project-bg" />

  <!-- Project Details (Left) -->
  <text x="25" y="35" class="title-text">MockPilot</text>
  <text x="25" y="55" class="stack-text">Next.js • Node.js • Express • PostgreSQL • Docker</text>
  
  <text x="25" y="80" class="desc-text">AI-powered mock API generation for schema-driven endpoints.</text>
  <text x="25" y="98" class="desc-text">Built for rapid development cycles, testing automation, and offline database mock models.</text>

  <!-- Divider -->
  <line x1="500" y1="20" x2="500" y2="120" stroke="var(--border)" stroke-width="1" />

  <!-- Project Parameters (Right / Inspector) -->
  <!-- Row 1 -->
  <text x="525" y="35" class="key-text">STATUS</text>
  <circle cx="530" cy="50" r="3.5" fill="var(--led-green)" />
  <circle cx="530" cy="50" r="7.5" fill="var(--led-green)" opacity="0.3" class="led-pulse" />
  <text x="545" y="54" class="val-text">Production / SaaS</text>

  <!-- Row 2 -->
  <text x="525" y="80" class="key-text">ARCHITECTURE TYPE</text>
  <text x="525" y="95" class="val-text">Developer Infrastructure</text>

  <!-- Row 3 -->
  <text x="680" y="80" class="key-text">FOCUS</text>
  <text x="680" y="95" class="val-text">API Simulation</text>
</svg>
