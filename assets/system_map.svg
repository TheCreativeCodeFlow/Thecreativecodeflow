<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1E293B" opacity="0.4" />
    </pattern>
    <style>
      .bg { fill: #030508; stroke: #0F172A; stroke-width: 1; }
      .box { fill: #080B10; stroke: #1E293B; stroke-width: 1.5; }
      .title-main { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 700; fill: #64748B; letter-spacing: 2px; }
      .title-box { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 700; fill: #F1F5F9; }
      .text-box { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #64748B; }
      .node-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 8px; fill: #64748B; font-weight: bold; }
      .accent-green { fill: #00FF87; }
      .accent-cyan { fill: #00E5FF; }
      .accent-amber { fill: #FF9100; }
      .line-connect { stroke: #1E293B; stroke-width: 1.5; fill: none; }
      .line-active { stroke: #00FF87; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; }
      .marker-cap { fill: #1E293B; }
      .marker-active { fill: #00FF87; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" class="marker-cap" />
    </marker>
    <marker id="arrow-active" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" class="marker-active" />
    </marker>
  </defs>

  <!-- Container -->
  <rect width="800" height="240" rx="8" class="bg" />
  <rect width="800" height="240" rx="8" fill="url(#dot-grid)" />

  <!-- Top System Header -->
  <text x="30" y="35" class="title-main">SYSTEM CORE MAP // WORKSPACE OVERLAY v3.1</text>
  <line x1="30" y1="45" x2="770" y2="45" stroke="#0F172A" stroke-width="1.5" />

  <!-- Flow Lines -->
  <!-- Box 1 to Box 2 -->
  <path d="M 170 125 L 220 125" class="line-active" marker-end="url(#arrow-active)" />
  <!-- Box 2 to Box 3 -->
  <path d="M 370 125 L 420 125" class="line-connect" marker-end="url(#arrow)" />
  <!-- Box 3 to Box 4 -->
  <path d="M 570 125 L 620 125" class="line-connect" marker-end="url(#arrow)" />

  <!-- Bidirectional Feedback Loop -->
  <path d="M 700 175 L 700 205 L 300 205 L 300 175" class="line-connect" stroke-dasharray="3,3" />
  <circle cx="700" cy="205" r="3" class="accent-cyan" />
  <circle cx="300" cy="205" r="3" class="accent-cyan" />

  <!-- BOX 1: CLIENT ENGINE -->
  <rect x="30" y="75" width="140" height="100" rx="6" class="box" />
  <rect x="30" y="75" width="140" height="6" rx="3" class="accent-green" />
  <circle cx="45" cy="95" r="3" class="accent-green" />
  <text x="55" y="99" class="title-box">Client / View</text>
  <text x="45" y="115" class="node-tag">[UI_NODE_0x1]</text>
  <text x="45" y="130" class="text-box">➔ React &amp; Next.js</text>
  <text x="45" y="145" class="text-box">➔ Tailwind &amp; GSAP</text>
  <text x="45" y="160" class="text-box">➔ WebGL Canvas</text>

  <!-- BOX 2: API & GATEWAY -->
  <rect x="230" y="75" width="140" height="100" rx="6" class="box" />
  <rect x="230" y="75" width="140" height="6" rx="3" class="accent-cyan" />
  <circle cx="245" cy="95" r="3" class="accent-cyan" />
  <text x="255" y="99" class="title-box">Gateway / API</text>
  <text x="245" y="115" class="node-tag">[API_GATE_0x2]</text>
  <text x="245" y="130" class="text-box">➔ Node.js &amp; Express</text>
  <text x="245" y="145" class="text-box">➔ Flask / FastAPI</text>
  <text x="245" y="160" class="text-box">➔ Spring Boot Core</text>

  <!-- BOX 3: DISTRIBUTED SERVICES -->
  <rect x="430" y="75" width="140" height="100" rx="6" class="box" />
  <rect x="430" y="75" width="140" height="6" rx="3" class="accent-amber" />
  <circle cx="445" cy="95" r="3" class="accent-amber" />
  <text x="455" y="99" class="title-box">Queue / Async</text>
  <text x="445" y="115" class="node-tag">[JOB_DAEMON_0x3]</text>
  <text x="445" y="130" class="text-box">➔ Turborepo Mono</text>
  <text x="445" y="145" class="text-box">➔ Dockerized Workers</text>
  <text x="445" y="160" class="text-box">➔ SSE Monitoring</text>

  <!-- BOX 4: DATA & AI -->
  <rect x="630" y="75" width="140" height="100" rx="6" class="box" />
  <rect x="630" y="75" width="140" height="6" rx="3" fill="#00E5FF" />
  <circle cx="645" cy="95" r="3" fill="#00E5FF" />
  <text x="655" y="99" class="title-box">Data &amp; AI Engine</text>
  <text x="645" y="115" class="node-tag">[INTELLIGENCE_0x4]</text>
  <text x="645" y="130" class="text-box">➔ Postgres / Supabase</text>
  <text x="645" y="145" class="text-box">➔ MongoDB Schema</text>
  <text x="645" y="160" class="text-box">➔ LLM Semantic Parser</text>
</svg>
