<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 260" width="100%" height="100%">
  <defs>
    <style>
      :root {
        --bg: #0b0b0c;
        --panel-bg: #121214;
        --border: #222225;
        --text-primary: #e4e4e7;
        --text-secondary: #71717a;
        --accent: #e2b13c;
        --led-green: #30d158;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #ffffff;
          --panel-bg: #f5f5f7;
          --border: #e5e5ea;
          --text-primary: #1c1c1e;
          --text-secondary: #8e8e93;
          --accent: #c69c24;
          --led-green: #34c759;
        }
      }
      .window-rect {
        fill: var(--bg);
        stroke: var(--border);
        stroke-width: 1;
      }
      .header-rect {
        fill: var(--panel-bg);
        stroke: var(--border);
        stroke-width: 1;
      }
      .dot {
        fill: var(--border);
      }
      .row-line {
        stroke: var(--border);
        stroke-width: 0.75;
      }
      .header-text {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 8px;
        font-weight: 700;
        letter-spacing: 1px;
        fill: var(--text-secondary);
      }
      .row-text {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 11px;
        fill: var(--text-primary);
      }
      .process-name {
        font-weight: 600;
      }
      .process-secondary {
        fill: var(--text-secondary);
      }
      .status-dot {
        fill: var(--led-green);
      }
      .pulse {
        animation: pulse-glow 2s infinite ease-in-out;
      }
      @keyframes pulse-glow {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Process Monitor Window Frame -->
  <rect x="5" y="5" width="380" height="250" rx="8" class="window-rect" />
  
  <!-- Header Bar -->
  <path d="M 5 13 A 8 8 0 0 1 13 5 L 377 5 A 8 8 0 0 1 385 13 L 385 35 L 5 35 Z" class="header-rect" />
  <circle cx="20" cy="20" r="4.5" class="dot" />
  <circle cx="34" cy="20" r="4.5" class="dot" />
  <circle cx="48" cy="20" r="4.5" class="dot" />
  <text x="65" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="var(--text-secondary)">Process Monitor</text>

  <!-- Table Headers -->
  <text x="20" y="55" class="header-text">PROCESS</text>
  <text x="180" y="55" class="header-text">CPU</text>
  <text x="235" y="55" class="header-text">MEM</text>
  <text x="295" y="55" class="header-text">STATUS</text>
  <line x1="15" y1="62" x2="375" y2="62" class="row-line" />

  <!-- Process Row 1 -->
  <text x="20" y="80" class="row-text process-name">MockPilot</text>
  <text x="180" y="80" class="row-text">24%</text>
  <text x="235" y="80" class="row-text process-secondary">128 MB</text>
  <circle cx="300" cy="76" r="3" class="status-dot" />
  <circle cx="300" cy="76" r="6" class="status-dot pulse" opacity="0.3" />
  <text x="312" y="80" class="row-text process-secondary">Active</text>
  <line x1="15" y1="92" x2="375" y2="92" class="row-line" />

  <!-- Process Row 2 -->
  <text x="20" y="110" class="row-text process-name">AI Infrastructure</text>
  <text x="180" y="110" class="row-text">42%</text>
  <text x="235" y="110" class="row-text process-secondary">512 MB</text>
  <circle cx="300" cy="106" r="3" class="status-dot" />
  <circle cx="300" cy="106" r="6" class="status-dot pulse" opacity="0.3" />
  <text x="312" y="110" class="row-text process-secondary">Active</text>
  <line x1="15" y1="122" x2="375" y2="122" class="row-line" />

  <!-- Process Row 3 -->
  <text x="20" y="140" class="row-text process-name">SaaS Platform</text>
  <text x="180" y="140" class="row-text">15%</text>
  <text x="235" y="140" class="row-text process-secondary">96 MB</text>
  <circle cx="300" cy="136" r="3" class="status-dot" />
  <circle cx="300" cy="136" r="6" class="status-dot pulse" opacity="0.3" />
  <text x="312" y="140" class="row-text process-secondary">Active</text>
  <line x1="15" y1="152" x2="375" y2="152" class="row-line" />

  <!-- Process Row 4 -->
  <text x="20" y="170" class="row-text process-name">Open Source</text>
  <text x="180" y="170" class="row-text">5%</text>
  <text x="235" y="170" class="row-text process-secondary">64 MB</text>
  <circle cx="300" cy="166" r="3" class="status-dot" />
  <circle cx="300" cy="166" r="6" class="status-dot pulse" opacity="0.3" />
  <text x="312" y="170" class="row-text process-secondary">Active</text>
  <line x1="15" y1="182" x2="375" y2="182" class="row-line" />

  <!-- Process Row 5 -->
  <text x="20" y="200" class="row-text process-name">System Design</text>
  <text x="180" y="200" class="row-text">14%</text>
  <text x="235" y="200" class="row-text process-secondary">256 MB</text>
  <circle cx="300" cy="196" r="3" class="status-dot" />
  <circle cx="300" cy="196" r="6" class="status-dot pulse" opacity="0.3" />
  <text x="312" y="200" class="row-text process-secondary">Active</text>
  <line x1="15" y1="212" x2="375" y2="212" class="row-line" />
</svg>
