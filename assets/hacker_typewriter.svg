<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 100" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1E293B" opacity="0.4" />
    </pattern>
    <style>
      .bg { fill: #030508; stroke: #0F172A; stroke-width: 1.5; }
      .bar { fill: #080B10; stroke: #0F172A; stroke-width: 1; }
      .dot-r { fill: #FF9100; }
      .dot-y { fill: #FFB300; }
      .dot-g { fill: #00FF87; }
      .term-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: bold; fill: #64748B; }
      .term-success { fill: #00FF87; }
      .term-cursor { fill: #00FF87; }
    </style>
    
    <!-- Clip paths for typewriter typing effect -->
    <clipPath id="clip-line1">
      <rect x="35" y="40" width="0" height="20">
        <animate attributeName="width" from="0" to="500" dur="1.2s" begin="0.2s" fill="freeze" />
      </rect>
    </clipPath>
    <clipPath id="clip-line2">
      <rect x="35" y="65" width="0" height="20">
        <animate attributeName="width" from="0" to="500" dur="1.5s" begin="1.6s" fill="freeze" />
      </rect>
    </clipPath>
  </defs>

  <!-- Container -->
  <rect width="800" height="100" rx="8" class="bg" />
  <rect width="800" height="100" rx="8" fill="url(#dot-grid)" />

  <!-- Window Header Bar -->
  <rect width="800" height="28" rx="8" class="bar" />
  <!-- Window Controls -->
  <circle cx="20" cy="14" r="4.5" class="dot-r" />
  <circle cx="34" cy="14" r="4.5" class="dot-y" />
  <circle cx="48" cy="14" r="4.5" class="dot-g" />
  <!-- Terminal Label -->
  <text x="400" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="1">hacker@TheCreativeCodeFlow:~</text>

  <!-- Line 1: Command Trigger -->
  <g clip-path="url(#clip-line1)">
    <text x="35" y="52" class="term-text"><tspan fill="#00FF87">TheCreativeCodeFlow:~$</tspan> initialize_workspace --port 9000</text>
  </g>

  <!-- Line 2: Output -->
  <g clip-path="url(#clip-line2)">
    <text x="35" y="77" class="term-text"><tspan class="term-success">[OK]</tspan> Host online. Welcome, Rahul Seervi. Ready.</text>
  </g>

  <!-- Blinking Cursor -->
  <rect x="375" y="66" width="6" height="12" class="term-cursor">
    <animate attributeName="opacity" values="0;0;1;0;1" keyTimes="0;0.5;0.51;0.75;1" dur="1s" repeatCount="indefinite" />
  </rect>
</svg>
