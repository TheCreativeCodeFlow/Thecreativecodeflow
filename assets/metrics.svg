  <text x="466" y="58" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">Top Ranks</text>
  <text x="466" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#555566" text-anchor="middle">SIH &amp; Tensor Wins</text>

