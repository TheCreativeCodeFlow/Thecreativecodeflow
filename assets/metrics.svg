<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="100%" height="100%">
  <defs>
    <linearGradient id="metrics-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05050a" />
      <stop offset="100%" stop-color="#0c0c18" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" rx="10" fill="url(#metrics-bg)" stroke="#1f1f2e" stroke-width="1.5" />

  <line x1="200" y1="18" x2="200" y2="102" stroke="#1f1f2e" stroke-width="1" />
  <line x1="400" y1="18" x2="400" y2="102" stroke="#1f1f2e" stroke-width="1" />
  <line x1="600" y1="18" x2="600" y2="102" stroke="#1f1f2e" stroke-width="1" />

  <text x="100" y="33" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#888899" text-anchor="middle" letter-spacing="0.5">FOCUS</text>
  <text x="100" y="62" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="800" fill="#d4af37" text-anchor="middle">4 Areas</text>
  <text x="100" y="82" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#555566" text-anchor="middle">Tools, AI, SaaS, systems</text>

  <text x="300" y="33" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#888899" text-anchor="middle" letter-spacing="0.5">BUILDS</text>
  <text x="300" y="62" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">6+ Shipped</text>
  <text x="300" y="82" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#555566" text-anchor="middle">From prototype to product</text>

  <text x="500" y="33" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#888899" text-anchor="middle" letter-spacing="0.5">MODES</text>
  <text x="500" y="62" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">Static First</text>
  <text x="500" y="82" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#555566" text-anchor="middle">Local SVGs, fewer requests</text>

  <text x="700" y="33" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#888899" text-anchor="middle" letter-spacing="0.5">PRINCIPLE</text>
  <text x="700" y="62" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="800" fill="#d4af37" text-anchor="middle">Faster Load</text>
  <text x="700" y="82" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#555566" text-anchor="middle">Better first impression</text>
