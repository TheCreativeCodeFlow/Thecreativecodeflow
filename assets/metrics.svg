  <text x="200" y="58" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">4+ Deployed</text>
  <text x="200" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#555566" text-anchor="middle">Agents &amp; models</text>

  <!-- Column 3: SaaS Platforms -->
  <text x="333" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#888899" text-anchor="middle" letter-spacing="0.5">SAAS BUILDS</text>
