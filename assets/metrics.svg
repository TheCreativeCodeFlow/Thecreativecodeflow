<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 100" width="100%" height="100%">
  <defs>
    <linearGradient id="metrics-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05050a" />
      <stop offset="100%" stop-color="#0a0a14" />
    </linearGradient>
  </defs>

  <!-- Border & Background -->
  <rect width="100%" height="100%" rx="8" fill="url(#metrics-bg)" stroke="#1f1f2e" stroke-width="1.5"/>

  <!-- Vertical Divider Lines -->
  <line x1="133" y1="15" x2="133" y2="85" stroke="#1f1f2e" stroke-width="1"/>
  <line x1="266" y1="15" x2="266" y2="85" stroke="#1f1f2e" stroke-width="1"/>
  <line x1="400" y1="15" x2="400" y2="85" stroke="#1f1f2e" stroke-width="1"/>
  <line x1="533" y1="15" x2="533" y2="85" stroke="#1f1f2e" stroke-width="1"/>
  <line x1="666" y1="15" x2="666" y2="85" stroke="#1f1f2e" stroke-width="1"/>

  <!-- Column 1: Products -->
  <text x="66" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#888899" text-anchor="middle" letter-spacing="0.5">PRODUCTS</text>
  <text x="66" y="58" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800" fill="#d4af37" text-anchor="middle">6+ Shipped</text>
