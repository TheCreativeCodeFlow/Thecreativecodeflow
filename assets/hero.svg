<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <style>
      :root {
        --bg: #0b0b0c;
        --panel-bg: #121214;
        --border: #222225;
        --text-primary: #e4e4e7;
        --text-secondary: #71717a;
        --accent: #e2b13c;
        --accent-rgb: 226, 177, 60;
        --led-green: #30d158;
        --grid-color: rgba(255, 255, 255, 0.015);
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #ffffff;
          --panel-bg: #f5f5f7;
          --border: #e5e5ea;
          --text-primary: #1c1c1e;
          --text-secondary: #8e8e93;
          --accent: #c69c24;
          --accent-rgb: 198, 156, 36;
          --led-green: #34c759;
          --grid-color: rgba(0, 0, 0, 0.015);
        }
      }
      .window-rect {
        fill: var(--panel-bg);
        stroke: var(--border);
        stroke-width: 1;
      }
      .panel-rect {
        fill: var(--bg);
        stroke: var(--border);
        stroke-width: 1;
      }
      .grid-bg {
        fill: url(#grid);
      }
      .title-dot {
        fill: var(--border);
      }
      .console-text {
        font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        fill: var(--text-primary);
        opacity: 0;
        animation: fadeIn 0.1s forwards;
      }
      .line1 { animation-delay: 0.1s; fill: var(--accent); font-weight: bold; }
      .line2 { animation-delay: 0.3s; fill: var(--text-secondary); }
      .line3 { animation-delay: 0.6s; }
      .line4 { animation-delay: 0.9s; }
      .line5 { animation-delay: 1.2s; }
      .line6 { animation-delay: 1.5s; }
      .line7 { animation-delay: 1.8s; }
      .line8 { animation-delay: 2.1s; }
      .line9 { animation-delay: 2.4s; }
      .line10 { animation-delay: 2.7s; }
      .line11 { animation-delay: 2.9s; }
      
      .cursor {
        animation: blink 1.2s infinite step-end;
      }
      .pulse {
        animation: pulse-glow 2s infinite ease-in-out;
      }
      
      @keyframes fadeIn {
        to { opacity: 1; }
      }
      @keyframes blink {
        50% { opacity: 0; }
      }
      @keyframes pulse-glow {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
    </style>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="var(--grid-color)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Outer OS Window Frame -->
  <rect x="5" y="5" width="790" height="350" rx="12" class="window-rect" />
  <rect x="5" y="5" width="790" height="350" rx="12" class="grid-bg" />

  <!-- Left Window (Console Interface) -->
  <rect x="25" y="25" width="415" height="310" rx="8" class="panel-rect" />
  
  <!-- macOS window control dots -->
  <circle cx="45" cy="45" r="5" class="title-dot" />
  <circle cx="61" cy="45" r="5" class="title-dot" />
  <circle cx="77" cy="45" r="5" class="title-dot" />
  <text x="95" y="48" font-family="system-ui, -apple-system" font-size="10" font-weight="600" fill="var(--text-secondary)" letter-spacing="0.5">RahulOS v3.0 - Setup Terminal</text>

  <!-- Console Log Text -->
  <text x="45" y="85" class="console-text line1">RahulOS v3.0</text>
  <text x="45" y="103" class="console-text line2">Boot Sequence Init...</text>
  
  <text x="45" y="130" class="console-text line3"><tspan fill="var(--accent)">✓</tspan> Loading User Profile</text>
  <text x="45" y="150" class="console-text line4"><tspan fill="var(--accent)">✓</tspan> Loading Engineering Modules</text>
  <text x="45" y="170" class="console-text line5"><tspan fill="var(--accent)">✓</tspan> Loading AI Runtime</text>
  <text x="45" y="190" class="console-text line6"><tspan fill="var(--accent)">✓</tspan> Loading SaaS Workspace</text>
  <text x="45" y="210" class="console-text line7"><tspan fill="var(--accent)">✓</tspan> Connecting GitHub Ecosystem</text>
  <text x="45" y="230" class="console-text line8"><tspan fill="var(--accent)">✓</tspan> Ready</text>
  
  <text x="45" y="260" class="console-text line9"><tspan fill="var(--accent)">&gt;</tspan> system_status: ONLINE<tspan class="cursor" fill="var(--accent)">_</tspan></text>
  
  <text x="45" y="295" class="console-text line10">
    <tspan fill="var(--text-secondary)">Build Target:</tspan> <tspan fill="var(--text-primary)" font-weight="bold">MockPilot (SaaS)</tspan>
  </text>
  <text x="45" y="313" class="console-text line11">
    <tspan fill="var(--text-secondary)">IP Address :</tspan> <tspan fill="var(--text-primary)">127.0.0.1 (Localhost)</tspan>
  </text>

  <!-- Right Pane Divider -->
  <line x1="465" y1="25" x2="465" y2="335" stroke="var(--border)" stroke-width="1" />

  <!-- Right Window (System Configurations) -->
  <text x="490" y="50" font-family="system-ui, -apple-system" font-size="10" font-weight="700" letter-spacing="1.5" fill="var(--text-secondary)">SYSTEM STATUS</text>

  <!-- Key Value Grid -->
  <!-- Row 1 -->
  <text x="490" y="85" font-family="system-ui, -apple-system" font-size="9" font-weight="600" letter-spacing="1" fill="var(--text-secondary)">USER</text>
  <text x="490" y="101" font-family="system-ui, -apple-system" font-size="13" font-weight="500" fill="var(--text-primary)">Rahul Seervi</text>

  <text x="640" y="85" font-family="system-ui, -apple-system" font-size="9" font-weight="600" letter-spacing="1" fill="var(--text-secondary)">CURRENT BUILD</text>
  <text x="640" y="101" font-family="system-ui, -apple-system" font-size="13" font-weight="600" fill="var(--accent)">MockPilot</text>

  <!-- Row 2 -->
  <text x="490" y="140" font-family="system-ui, -apple-system" font-size="9" font-weight="600" letter-spacing="1" fill="var(--text-secondary)">ROLE</text>
  <text x="490" y="156" font-family="system-ui, -apple-system" font-size="13" font-weight="500" fill="var(--text-primary)">Product Builder</text>

  <text x="640" y="140" font-family="system-ui, -apple-system" font-size="9" font-weight="600" letter-spacing="1" fill="var(--text-secondary)">VERSION</text>
  <text x="640" y="156" font-family="system-ui, -apple-system" font-size="13" font-weight="500" fill="var(--text-primary)">RahulOS v3.0</text>

  <!-- Row 3 -->
  <text x="490" y="195" font-family="system-ui, -apple-system" font-size="9" font-weight="600" letter-spacing="1" fill="var(--text-secondary)">STATUS</text>
  <circle cx="495" cy="210" r="4.5" fill="var(--led-green)" />
  <circle cx="495" cy="210" r="8.5" fill="var(--led-green)" opacity="0.35" class="pulse" />
  <text x="510" y="214" font-family="system-ui, -apple-system" font-size="13" font-weight="500" fill="var(--text-primary)">Online</text>

  <text x="640" y="195" font-family="system-ui, -apple-system" font-size="9" font-weight="600" letter-spacing="1" fill="var(--text-secondary)">DEPLOYMENT</text>
  <text x="640" y="211" font-family="system-ui, -apple-system" font-size="12" font-weight="500" fill="var(--text-primary)">Active Cycle</text>

  <!-- Divider inside configurations -->
  <line x1="490" y1="240" x2="770" y2="240" stroke="var(--border)" stroke-width="1" />

  <!-- Resource Monitors -->
  <text x="490" y="262" font-family="system-ui, -apple-system" font-size="10" font-weight="700" letter-spacing="1.5" fill="var(--text-secondary)">OS WORKSPACE MONITOR</text>

  <text x="490" y="288" font-family="system-ui, -apple-system" font-size="11" font-weight="500" fill="var(--text-primary)">CPU Usage</text>
  <rect x="580" y="281" width="190" height="7" rx="3.5" fill="var(--border)" />
  <rect x="580" y="281" width="38" height="7" rx="3.5" fill="var(--accent)" /> <!-- 20% load -->
  <text x="745" y="274" font-family="system-ui, -apple-system" font-size="9" font-weight="600" fill="var(--text-secondary)">20%</text>

  <text x="490" y="315" font-family="system-ui, -apple-system" font-size="11" font-weight="500" fill="var(--text-primary)">AI Runtime</text>
  <rect x="580" y="308" width="190" height="7" rx="3.5" fill="var(--border)" />
  <rect x="580" y="308" width="114" height="7" rx="3.5" fill="var(--accent)" /> <!-- 60% load -->
  <text x="745" y="301" font-family="system-ui, -apple-system" font-size="9" font-weight="600" fill="var(--text-secondary)">60%</text>
</svg>
