<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 150" width="100%" height="150">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05050a" />
      <stop offset="100%" stop-color="#0a0a14" />
    </linearGradient>
    <!-- Gold Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd700" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#ffd700" />
    </linearGradient>
  </defs>

  <!-- Border & Background -->
  <rect width="100%" height="100%" rx="8" fill="url(#bg-grad)" stroke="#1f1f2e" stroke-width="1.5"/>

  <!-- Left Accent Stripe (Stripe/Linear style) -->
  <rect x="0" y="0" width="6" height="150" fill="url(#gold-grad)" rx="3"/>

  <!-- Terminal window dots (Apple-style) -->
  <circle cx="25" cy="25" r="4.5" fill="#ff5f56"/>
  <circle cx="40" cy="25" r="4.5" fill="#ffbd2e"/>
  <circle cx="55" cy="25" r="4.5" fill="#27c93f"/>

  <!-- Grid lines (Linear style) -->
  <line x1="280" y1="0" x2="280" y2="150" stroke="#1f1f2e" stroke-width="1"/>
  <line x1="560" y1="0" x2="560" y2="150" stroke="#1f1f2e" stroke-width="1"/>

  <!-- Column 1: Identity (Rahul Seervi) -->
  <text x="25" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="0.5">RAHUL SEERVI</text>
  <text x="25" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#d4af37" letter-spacing="1">PRODUCT BUILDER &bull; AI ENGINEER</text>
  <text x="25" y="115" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" fill="#888899">&gt; shipping_mode: active</text>

  <!-- Column 2: Mission Statement -->
  <text x="300" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#888899" letter-spacing="0.5">MISSION OBJECTIVE</text>
  <text x="300" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#ffffff">Building intelligent automation,</text>
  <text x="300" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#ffffff">scalable SaaS infrastructures,</text>
  <text x="300" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#ffffff">and elite developer tools.</text>

  <!-- Column 3: Active Status System -->
  <text x="580" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#888899" letter-spacing="0.5">SYSTEM STATUS</text>
  
  <rect x="580" y="58" width="200" height="24" rx="4" fill="#0d1117" stroke="#1f1f2e" stroke-width="1"/>
  <circle cx="595" cy="70" r="4.5" fill="#27c93f"/>
  <text x="610" y="74" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" font-weight="bold" fill="#27c93f">BUILD: MOCKPILOT v1.2</text>

  <rect x="580" y="92" width="200" height="24" rx="4" fill="#0d1117" stroke="#1f1f2e" stroke-width="1"/>
  <circle cx="595" cy="104" r="4.5" fill="#ffd700"/>
  <text x="610" y="108" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" font-weight="bold" fill="#ffd700">STACK: TS &bull; PYTHON &bull; SAAS</text>
</svg>
