<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" width="100%" height="100%">
  <defs>
    <style>
      :root {
        --bg: #0b0b0c;
        --panel-bg: #121214;
        --border: #222225;
        --text-primary: #e4e4e7;
        --text-secondary: #71717a;
        --accent: #e2b13c;
        --led-green: #30d158;
        --led-green-rgb: 48, 209, 88;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #ffffff;
          --panel-bg: #f5f5f7;
          --border: #e5e5ea;
          --text-primary: #1c1c1e;
          --text-secondary: #8e8e93;
          --accent: #c69c24;
          --led-green: #34c759;
          --led-green-rgb: 52, 199, 89;
        }
      }
      .window-rect {
        fill: var(--panel-bg);
        stroke: var(--border);
        stroke-width: 1;
      }
      .panel-rect {
        fill: var(--bg);
        stroke: var(--border);
        stroke-width: 1;
      }
      .dot {
        fill: var(--border);
      }
      .log-text {
        font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        fill: var(--text-primary);
      }
      .log-muted {
        fill: var(--text-secondary);
      }
      
      /* Animation delays for diagnostics sequence */
      .check-1, .status-1 { opacity: 0; animation: fadeIn 0.1s forwards; animation-delay: 0.5s; }
      .check-2, .status-2 { opacity: 0; animation: fadeIn 0.1s forwards; animation-delay: 1.0s; }
      .check-3, .status-3 { opacity: 0; animation: fadeIn 0.1s forwards; animation-delay: 1.5s; }
      .check-4, .status-4 { opacity: 0; animation: fadeIn 0.1s forwards; animation-delay: 2.0s; }
      
      .health-ring {
        stroke-dasharray: 220;
        stroke-dashoffset: 220;
        stroke: var(--led-green);
        animation: fill-ring 2s forwards ease-out;
        animation-delay: 0.5s;
      }
      .pulse-green {
        animation: pulse-glow 2s infinite ease-in-out;
      }
      
      @keyframes fadeIn {
        to { opacity: 1; }
      }
      @keyframes fill-ring {
        to { stroke-dashoffset: 2; }
      }
      @keyframes pulse-glow {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Diagnostics Window -->
  <rect x="5" y="5" width="790" height="170" rx="10" class="window-rect" />

  <!-- Window Header -->
  <circle cx="25" cy="22" r="4.5" class="dot" />
  <circle cx="39" cy="22" r="4.5" class="dot" />
  <circle cx="53" cy="22" r="4.5" class="dot" />
  <text x="70" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="var(--text-secondary)">RahulOS Diagnostics Center - System Telemetry</text>

  <!-- Left Console Column -->
  <rect x="20" y="45" width="460" height="115" rx="6" class="panel-rect" />
  <text x="35" y="65" class="log-text log-muted">Running System Diagnostics v3.0.0...</text>

  <!-- Row 1 -->
  <text x="35" y="88" class="log-text">
    <tspan class="check-1" fill="var(--accent)">✓</tspan> Contribution Engine
  </text>
  <text x="210" y="88" class="log-text log-muted">.........................</text>
  <text x="380" y="88" class="log-text"><tspan class="status-1" fill="var(--led-green)" font-weight="bold">ONLINE</tspan></text>

  <!-- Row 2 -->
  <text x="35" y="106" class="log-text">
    <tspan class="check-2" fill="var(--accent)">✓</tspan> Repository Health
  </text>
  <text x="210" y="106" class="log-text log-muted">.........................</text>
  <text x="380" y="106" class="log-text"><tspan class="status-2" fill="var(--led-green)" font-weight="bold">OPTIMAL</tspan></text>

  <!-- Row 3 -->
  <text x="35" y="124" class="log-text">
    <tspan class="check-3" fill="var(--accent)">✓</tspan> Build Pipeline
  </text>
  <text x="210" y="124" class="log-text log-muted">.........................</text>
  <text x="380" y="124" class="log-text"><tspan class="status-3" fill="var(--accent)" font-weight="bold">ACTIVE</tspan></text>

  <!-- Row 4 -->
  <text x="35" y="142" class="log-text">
    <tspan class="check-4" fill="var(--accent)">✓</tspan> Activity Sync
  </text>
  <text x="210" y="142" class="log-text log-muted">.........................</text>
  <text x="380" y="142" class="log-text"><tspan class="status-4" fill="var(--text-primary)" font-weight="bold">COMPLETE</tspan></text>

  <!-- Right Visual Diagnostics Section -->
  <!-- Circular Health Dial -->
  <circle cx="630" cy="92" r="35" fill="none" stroke="var(--border)" stroke-width="6" />
  <circle cx="630" cy="92" r="35" fill="none" stroke-width="6" stroke-linecap="round" class="health-ring" transform="rotate(-90 630 92)" />
  <text x="630" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="var(--text-primary)" text-anchor="middle">99.9%</text>
  <text x="630" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="var(--text-secondary)" text-anchor="middle" letter-spacing="1">SYSTEM HEALTH</text>

  <!-- Mini Status LED in bottom-right -->
  <circle cx="730" cy="92" r="4.5" fill="var(--led-green)" />
  <circle cx="730" cy="92" r="8.5" fill="var(--led-green)" opacity="0.3" class="pulse-green" />
  <text x="730" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="var(--text-secondary)" text-anchor="middle" letter-spacing="1">MONITOR</text>
</svg>
