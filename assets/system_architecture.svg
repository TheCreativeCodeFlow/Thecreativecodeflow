<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="sys-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061D30" />
      <stop offset="60%" stop-color="#042F40" />
      <stop offset="100%" stop-color="#061D30" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064663" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#042F40" stop-opacity="0.8" />
    </linearGradient>

    <!-- Dot Pattern -->
    <pattern id="sys-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#064663" opacity="0.6" />
    </pattern>

    <!-- Arrow Marker Passive -->
    <marker id="arr-passive" viewBox="0 0 8 8" refX="5" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 6 4 L 1 7 z" fill="#064663" />
    </marker>

    <!-- Arrow Marker Active Teal -->
    <marker id="arr-active" viewBox="0 0 8 8" refX="5" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 6 4 L 1 7 z" fill="#00C9B7" />
    </marker>
  </defs>

  <style>
    .sys-header { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11px; font-weight: 700; fill: #00C9B7; letter-spacing: 2px; }
    .sys-sub { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; font-size: 8.5px; fill: #8FA7B5; letter-spacing: 1px; }
    .tier-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #EAF2F5; letter-spacing: 0.3px; }
    .tier-tag { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 8px; font-weight: 700; fill: #8FA7B5; letter-spacing: 1px; }
    .item-bullet { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 9.5px; fill: #8FA7B5; }
    .item-highlight { fill: #EAF2F5; font-weight: 600; }
    .bus-text { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 7.5px; fill: #8FA7B5; letter-spacing: 1px; }
  </style>

  <!-- Canvas Background -->
  <rect width="900" height="300" rx="8" fill="url(#sys-bg)" stroke="#064663" stroke-width="1.5" />
  <rect width="900" height="300" rx="8" fill="url(#sys-dots)" />

  <!-- Top Status Bar -->
  <g transform="translate(28, 26)">
    <circle cx="5" cy="4" r="3.5" fill="#00C9B7">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" />
    </circle>
    <text x="18" y="8" class="sys-header">CONCEPTUAL SYSTEM ARCHITECTURE // MULTI-TIER ENGINEERING MAP</text>
    <text x="844" y="8" class="sys-sub" text-anchor="end">DOMAIN SPECIFICATION v4.0</text>
    <line x1="0" y1="18" x2="844" y2="18" stroke="#064663" stroke-width="1" />
  </g>

  <!-- Flow Connector Lines -->
  <!-- Tier 1 to Tier 2 -->
  <path d="M 220 145 L 250 145" stroke="#00C9B7" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-active)" fill="none" />
  <!-- Tier 2 to Tier 3 -->
  <path d="M 430 145 L 460 145" stroke="#00C9B7" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-active)" fill="none" />
  <!-- Tier 3 to Tier 4 -->
  <path d="M 640 145 L 670 145" stroke="#00C9B7" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-active)" fill="none" />

  <!-- Observability Back-Channel Line -->
  <path d="M 760 215 L 760 248 L 130 248 L 130 215" stroke="#064663" stroke-width="1.2" stroke-dasharray="4,4" fill="none" />
  <circle cx="760" cy="248" r="3" fill="#F0B45F" />
  <circle cx="445" cy="248" r="3" fill="#00C9B7" />
  <circle cx="130" cy="248" r="3" fill="#00C9B7" />

  <!-- Observability Label -->
  <text x="445" y="262" class="bus-text" text-anchor="middle">REAL-TIME TELEMETRY &amp; STATE FEEDBACK BUS (SSE / METRICS / AUDIT)</text>

  <!-- ================= TIER 1: CLIENT APPLICATIONS ================= -->
  <g transform="translate(30, 60)">
    <!-- Container Card -->
    <rect width="190" height="155" rx="6" fill="url(#card-grad)" stroke="#064663" stroke-width="1" />
    <rect width="190" height="4" rx="2" fill="#00C9B7" />
    
    <text x="14" y="24" class="tier-title">Client Applications</text>
    <text x="14" y="38" class="tier-tag">[EDGE_DOM_VIEWPORT]</text>
    <line x1="14" y1="46" x2="176" y2="46" stroke="#064663" stroke-width="0.8" />

    <text x="14" y="66" class="item-bullet">▪ <tspan class="item-highlight">Next.js</tspan> SSR &amp; Routing</text>
    <text x="14" y="86" class="item-bullet">▪ <tspan class="item-highlight">React</tspan> State Runtimes</text>
    <text x="14" y="106" class="item-bullet">▪ <tspan class="item-highlight">TailwindCSS</tspan> Design Systems</text>
    <text x="14" y="126" class="item-bullet">▪ <tspan class="item-highlight">WebGL / Canvas</tspan> Visuals</text>
    <text x="14" y="144" font-family="ui-monospace, monospace" font-size="7.5" fill="#8FA7B5">Responsive &amp; Accessible</text>
  </g>

  <!-- ================= TIER 2: API & GATEWAY ================= -->
  <g transform="translate(250, 60)">
    <!-- Container Card -->
    <rect width="180" height="155" rx="6" fill="url(#card-grad)" stroke="#064663" stroke-width="1" />
    <rect width="180" height="4" rx="2" fill="#064663" />

    <text x="14" y="24" class="tier-title">API &amp; Ingestion</text>
    <text x="14" y="38" class="tier-tag">[INGRESS_ROUTER]</text>
    <line x1="14" y1="46" x2="166" y2="46" stroke="#064663" stroke-width="0.8" />

    <text x="14" y="66" class="item-bullet">▪ <tspan class="item-highlight">Node.js / Express</tspan> Services</text>
    <text x="14" y="86" class="item-bullet">▪ <tspan class="item-highlight">TypeScript</tspan> Contract Schemas</text>
    <text x="14" y="106" class="item-bullet">▪ <tspan class="item-highlight">FastAPI / Flask</tspan> Micro-APIs</text>
    <text x="14" y="126" class="item-bullet">▪ <tspan class="item-highlight">REST &amp; SSE</tspan> Gateways</text>
    <text x="14" y="144" font-family="ui-monospace, monospace" font-size="7.5" fill="#8FA7B5">Validation &amp; Rate-Limiting</text>
  </g>

  <!-- ================= TIER 3: DISTRIBUTED ASYNC DAEMONS ================= -->
  <g transform="translate(460, 60)">
    <!-- Container Card -->
    <rect width="180" height="155" rx="6" fill="url(#card-grad)" stroke="#064663" stroke-width="1" />
    <rect width="180" height="4" rx="2" fill="#F0B45F" />

    <text x="14" y="24" class="tier-title">Async &amp; Distributed</text>
    <text x="14" y="38" class="tier-tag">[QUEUE_WORKER_POOL]</text>
    <line x1="14" y1="46" x2="166" y2="46" stroke="#064663" stroke-width="0.8" />

    <text x="14" y="66" class="item-bullet">▪ <tspan class="item-highlight">Turborepo</tspan> Monorepo Base</text>
    <text x="14" y="86" class="item-bullet">▪ <tspan class="item-highlight">Job Partitioning</tspan> Logic</text>
    <text x="14" y="106" class="item-bullet">▪ <tspan class="item-highlight">Dockerized</tspan> Worker Pools</text>
    <text x="14" y="126" class="item-bullet">▪ <tspan class="item-highlight">At-Least-Once</tspan> Guarantees</text>
    <text x="14" y="144" font-family="ui-monospace, monospace" font-size="7.5" fill="#8FA7B5">Failure Recovery &amp; Mutex</text>
  </g>

  <!-- ================= TIER 4: PERSISTENCE & AI ================= -->
  <g transform="translate(670, 60)">
    <!-- Container Card -->
    <rect width="200" height="155" rx="6" fill="url(#card-grad)" stroke="#064663" stroke-width="1" />
    <rect width="200" height="4" rx="2" fill="#00C9B7" />

    <text x="14" y="24" class="tier-title">Persistence &amp; AI</text>
    <text x="14" y="38" class="tier-tag">[STORAGE_AND_MODELS]</text>
    <line x1="14" y1="46" x2="186" y2="46" stroke="#064663" stroke-width="0.8" />

    <text x="14" y="66" class="item-bullet">▪ <tspan class="item-highlight">PostgreSQL</tspan> Relational State</text>
    <text x="14" y="86" class="item-bullet">▪ <tspan class="item-highlight">MongoDB</tspan> Document Schemas</text>
    <text x="14" y="106" class="item-bullet">▪ <tspan class="item-highlight">SentenceTransformers</tspan> NLP</text>
    <text x="14" y="126" class="item-bullet">▪ <tspan class="item-highlight">Scikit-Learn</tspan> Forecast Models</text>
    <text x="14" y="144" font-family="ui-monospace, monospace" font-size="7.5" fill="#8FA7B5">Audited Schema Migrations</text>
  </g>
</svg>
