<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061D30" />
      <stop offset="50%" stop-color="#042F40" />
      <stop offset="100%" stop-color="#061D30" />
    </linearGradient>

    <!-- Panel Gradient -->
    <linearGradient id="panel-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064663" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#042F40" stop-opacity="0.6" />
    </linearGradient>

    <!-- Fine Architectural Grid Pattern -->
    <pattern id="arch-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#064663" stroke-width="0.75" stroke-opacity="0.4" />
      <circle cx="24" cy="24" r="0.8" fill="#00C9B7" opacity="0.3" />
    </pattern>

    <!-- Radial Glow for Accent Focus -->
    <radialGradient id="teal-glow" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00C9B7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#061D30" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .mono-lead { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11px; font-weight: 700; fill: #00C9B7; letter-spacing: 2px; }
    .hero-name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 38px; font-weight: 800; fill: #EAF2F5; letter-spacing: -0.5px; }
    .hero-spec { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; font-size: 12.5px; font-weight: 600; fill: #F0B45F; letter-spacing: 1px; }
    .hero-tagline { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 13px; font-weight: 400; fill: #8FA7B5; line-height: 1.5; }
    .hud-title { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; font-size: 9px; font-weight: 700; fill: #8FA7B5; letter-spacing: 1.5px; }
    .hud-stat-val { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; font-size: 14px; font-weight: 700; fill: #EAF2F5; }
    .hud-stat-lbl { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; font-size: 8px; font-weight: 600; fill: #8FA7B5; letter-spacing: 1px; }
    .hud-metric-box { fill: #042F40; stroke: #064663; stroke-width: 1; }
    .pulse-beacon { animation: beaconPulse 2.5s ease-in-out infinite; }
  </style>

  <!-- Base Canvas -->
  <rect width="900" height="240" rx="8" fill="url(#hero-bg)" stroke="#064663" stroke-width="1.5" />
  <rect width="900" height="240" rx="8" fill="url(#arch-grid)" />
  <rect width="900" height="240" rx="8" fill="url(#teal-glow)" />

  <!-- Top Accent Horizon Line -->
  <line x1="0" y1="2" x2="900" y2="2" stroke="#00C9B7" stroke-width="2" stroke-opacity="0.8" />

  <!-- Architectural Frame Details -->
  <!-- Top Left Corner Coordinate Mark -->
  <path d="M 24 35 L 24 24 L 35 24" fill="none" stroke="#00C9B7" stroke-width="1.5" />
  <!-- Bottom Left Corner Coordinate Mark -->
  <path d="M 24 205 L 24 216 L 35 216" fill="none" stroke="#064663" stroke-width="1.5" />
  <!-- Top Right Corner Coordinate Mark -->
  <path d="M 876 35 L 876 24 L 865 24" fill="none" stroke="#064663" stroke-width="1.5" />
  <!-- Bottom Right Corner Coordinate Mark -->
  <path d="M 876 205 L 876 216 L 865 216" fill="none" stroke="#00C9B7" stroke-width="1.5" />

  <!-- Left Column: Primary Identity & Engineering Scope -->
  <g transform="translate(42, 38)">
    <!-- Terminal System Identifier -->
    <g transform="translate(0, 0)">
      <circle cx="5" cy="4" r="4" fill="#00C9B7">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite" />
      </circle>
      <text x="18" y="8" class="mono-lead">SYSTEM ID // THECREATIVECODEFLOW</text>
    </g>

    <!-- Name Heading -->
    <text x="0" y="48" class="hero-name">Rahul Seervi</text>

    <!-- Discipline Pillars -->
    <text x="0" y="74" class="hero-spec">BACKEND ARCHITECTURE  //  DISTRIBUTED SYSTEMS  //  AI PLATFORMS</text>

    <!-- Divider Line with Diamond Intercept -->
    <line x1="0" y1="88" x2="480" y2="88" stroke="#064663" stroke-width="1" />
    <polygon points="240,85 243,88 240,91 237,88" fill="#F0B45F" />

    <!-- Tagline -->
    <text x="0" y="112" class="hero-tagline">Architecting high-throughput distributed queues, resilient API topologies,</text>
    <text x="0" y="130" class="hero-tagline">and verifiable full-stack platforms engineered for zero operational friction.</text>

    <!-- Verification / Discipline Badges -->
    <g transform="translate(0, 150)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="132" height="22" rx="4" fill="#042F40" stroke="#064663" stroke-width="1" />
      <circle cx="10" cy="11" r="2.5" fill="#00C9B7" />
      <text x="18" y="14" font-family="ui-monospace, SFMono-Regular, monospace" font-size="8.5" font-weight="700" fill="#EAF2F5" letter-spacing="0.5px">MONOREPO SYSTEMS</text>

      <!-- Badge 2 -->
      <rect x="140" y="0" width="138" height="22" rx="4" fill="#042F40" stroke="#064663" stroke-width="1" />
      <circle cx="150" cy="11" r="2.5" fill="#00C9B7" />
      <text x="158" y="14" font-family="ui-monospace, SFMono-Regular, monospace" font-size="8.5" font-weight="700" fill="#EAF2F5" letter-spacing="0.5px">EVENT-DRIVEN QUEUES</text>

      <!-- Badge 3 -->
      <rect x="286" y="0" width="126" height="22" rx="4" fill="#042F40" stroke="#064663" stroke-width="1" />
      <circle cx="296" cy="11" r="2.5" fill="#F0B45F" />
      <text x="304" y="14" font-family="ui-monospace, SFMono-Regular, monospace" font-size="8.5" font-weight="700" fill="#EAF2F5" letter-spacing="0.5px">TYPE SAFETY (TS)</text>
    </g>
  </g>

  <!-- Center-Right Vertical Structural Divider -->
  <line x1="570" y1="28" x2="570" y2="212" stroke="#064663" stroke-width="1" stroke-dasharray="3,3" opacity="0.6" />

  <!-- Right Column: Engineering HUD & Topology Summary -->
  <g transform="translate(600, 32)">
    <!-- HUD Header -->
    <text x="0" y="10" class="hud-title">SYSTEM ARCHITECTURE STATUS</text>
    <text x="250" y="10" class="hud-title" text-anchor="end" fill="#00C9B7">ACTIVE // OK</text>
    <line x1="0" y1="18" x2="250" y2="18" stroke="#064663" stroke-width="1" />

    <!-- Metric Card 1: Core Architecture -->
    <g transform="translate(0, 26)">
      <rect width="120" height="64" rx="4" class="hud-metric-box" />
      <line x1="0" y1="0" x2="120" y2="0" stroke="#00C9B7" stroke-width="2" />
      <text x="12" y="18" class="hud-stat-lbl">CORE RUNTIME</text>
      <text x="12" y="38" class="hud-stat-val">Node / TS</text>
      <text x="12" y="52" font-family="ui-monospace, monospace" font-size="8" fill="#8FA7B5">Modular Monorepo</text>
    </g>

    <!-- Metric Card 2: Distributed Processing -->
    <g transform="translate(130, 26)">
      <rect width="120" height="64" rx="4" class="hud-metric-box" />
      <line x1="0" y1="0" x2="064663" stroke="#F0B45F" stroke-width="2" />
      <text x="12" y="18" class="hud-stat-lbl">ASYNC PIPELINES</text>
      <text x="12" y="38" class="hud-stat-val" fill="#F0B45F">Workers</text>
      <text x="12" y="52" font-family="ui-monospace, monospace" font-size="8" fill="#8FA7B5">Event Streaming</text>
    </g>

    <!-- Metric Card 3: Persistence -->
    <g transform="translate(0, 98)">
      <rect width="120" height="64" rx="4" class="hud-metric-box" />
      <line x1="0" y1="0" x2="120" y2="0" stroke="#064663" stroke-width="2" />
      <text x="12" y="18" class="hud-stat-lbl">DATA STORES</text>
      <text x="12" y="38" class="hud-stat-val">Postgres / Mongo</text>
      <text x="12" y="52" font-family="ui-monospace, monospace" font-size="8" fill="#8FA7B5">Relational &amp; Doc</text>
    </g>

    <!-- Metric Card 4: Product Delivery -->
    <g transform="translate(130, 98)">
      <rect width="120" height="64" rx="4" class="hud-metric-box" />
      <line x1="0" y1="0" x2="120" y2="0" stroke="#00C9B7" stroke-width="2" />
      <text x="12" y="18" class="hud-stat-lbl">CLIENT INTERFACES</text>
      <text x="12" y="38" class="hud-stat-val">React / Next</text>
      <text x="12" y="52" font-family="ui-monospace, monospace" font-size="8" fill="#8FA7B5">Responsive &amp; WebGL</text>
    </g>

    <!-- Bottom HUD Status Line -->
    <g transform="translate(0, 172)">
      <circle cx="4" cy="5" r="3" fill="#00C9B7" />
      <text x="14" y="9" font-family="ui-monospace, monospace" font-size="8" fill="#8FA7B5" letter-spacing="0.5px">ENVIRONMENT: CONTAINERIZED • WORKSPACE: ISOLATED</text>
    </g>
  </g>
</svg>
