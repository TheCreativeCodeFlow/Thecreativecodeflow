<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 260" width="100%" height="100%">
  <defs>
    <style>
      :root {
        --bg: #0b0b0c;
        --panel-bg: #121214;
        --border: #222225;
        --text-primary: #e4e4e7;
        --text-secondary: #71717a;
        --accent: #e2b13c;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #ffffff;
          --panel-bg: #f5f5f7;
          --border: #e5e5ea;
          --text-primary: #1c1c1e;
          --text-secondary: #8e8e93;
          --accent: #c69c24;
        }
      }
      .window-rect {
        fill: var(--bg);
        stroke: var(--border);
        stroke-width: 1;
      }
      .header-rect {
        fill: var(--panel-bg);
        stroke: var(--border);
        stroke-width: 1;
      }
      .dot {
        fill: var(--border);
      }
      .terminal-text {
        font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
      }
      .prompt {
        fill: var(--accent);
      }
      .output {
        fill: var(--text-primary);
        font-weight: 500;
      }
      .cursor {
        fill: var(--accent);
        animation: blink 1.2s infinite step-end;
      }
      @keyframes blink {
        50% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Terminal Window Frame -->
  <rect x="5" y="5" width="380" height="250" rx="8" class="window-rect" />
  
  <!-- Header Bar -->
  <path d="M 5 13 A 8 8 0 0 1 13 5 L 377 5 A 8 8 0 0 1 385 13 L 385 35 L 5 35 Z" class="header-rect" />
  <circle cx="20" cy="20" r="4.5" class="dot" />
  <circle cx="34" cy="20" r="4.5" class="dot" />
  <circle cx="48" cy="20" r="4.5" class="dot" />
  <text x="65" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="var(--text-secondary)">RahulOS Terminal</text>

  <!-- Commands & Outputs -->
  <!-- Command 1 -->
  <text x="20" y="65" class="terminal-text prompt">&gt; current-project</text>
  <text x="20" y="82" class="terminal-text output">MockPilot</text>

  <!-- Command 2 -->
  <text x="20" y="110" class="terminal-text prompt">&gt; active-focus</text>
  <text x="20" y="127" class="terminal-text output">Developer Infrastructure</text>

  <!-- Command 3 -->
  <text x="20" y="155" class="terminal-text prompt">&gt; next-goal</text>
  <text x="20" y="172" class="terminal-text output">Launch scalable SaaS platform</text>

  <!-- Command 4 -->
  <text x="20" y="200" class="terminal-text prompt">&gt; system-status</text>
  <text x="20" y="217" class="terminal-text output">READY <tspan class="cursor">_</tspan></text>
</svg>
